[options]
; Configuracion de Odoo para el entorno local del curso MF1215
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Contrasena maestra del gestor de bases de datos (solo accesible desde tu equipo)
admin_passwd = admin
http_interface = 0.0.0.0
; Recarga las vistas XML ya instaladas sin actualizar el modulo (F5 en el navegador)
dev_mode = xml
